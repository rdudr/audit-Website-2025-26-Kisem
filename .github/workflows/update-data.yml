name: Update KISEM Company Data

# Downloads the published master sheet, runs the import, and commits ONLY the public data file
# (kisem-annual-report/src/data/audits.json: no company names, addresses or plant contacts).
# The spreadsheet itself and the team-only file are never committed: they hold plant contacts.

on:
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Spreadsheet from Google Sheets
        id: sheet
        run: |
          URL=$(jq -r '.googleSheetExcelUrl' google-sheet-config.json)
          if [[ "$URL" == *"YOUR_GOOGLE_SHEETS_PUBLISHED"* ]] || [[ "$URL" == *"1A2B3C4D5E6F7G8H9I0J"* ]]; then
            echo "Google Sheet URL is the default placeholder. Skipping data update."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/master.xlsx" "$URL"

      - name: Run the import
        if: steps.sheet.outputs.skip != '1'
        run: |
          npm install --no-save xlsx@0.18.5
          node kisem-annual-report/scripts/parse-excel.cjs "$RUNNER_TEMP/master.xlsx"
          rm -rf private "$RUNNER_TEMP/master.xlsx"

      - name: Commit the public data file
        if: steps.sheet.outputs.skip != '1'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- kisem-annual-report/src/data/audits.json; then
            echo "No data changes."
          else
            git add kisem-annual-report/src/data/audits.json
            git commit -m "data: sync audits from the master sheet [skip ci]"
            git push
          fi
